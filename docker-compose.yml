services:
  postgres:
    image: postgres:16-alpine
    container_name: cursinet-db
    environment:
      POSTGRES_DB: cursinet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cursinet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cursinet-api
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__RefreshSecret: ${Jwt__RefreshSecret}
      SendGrid__ApiKey: ${SendGrid__ApiKey}
      SendGrid__FromEmail: ${SendGrid__FromEmail}
      SendGrid__FromName: ${SendGrid__FromName}
      SendGrid__BaseUrl: ${SendGrid__BaseUrl}
      PayPal__Enabled: true
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5001/api/v1"
    container_name: cursinet-web
    ports:
      - "3006:3000"
    environment:
      # Para Server Components (adentro del contenedor Docker)
      API_URL: "http://cursinet-api:8080/api/v1"
      # Para Client Components (desde el navegador)
      NEXT_PUBLIC_API_URL: "http://localhost:5001/api/v1"
    depends_on:
      - backend

volumes:
  pgdata:
